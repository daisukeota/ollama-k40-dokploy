services:
  ollama_k40:
    build:
      context: .
      dockerfile: Dockerfile
    runtime: nvidia
    container_name: ollama_k40_dokploy
    ports:
      - 11434:11434
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0'] 
              capabilities:
                - gpu
volumes:
  ollama_data: null
networks:
  dokploy-network:
    external: true
